<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Lightsaber AR Camera</title>
<style>
:root{--color-bg:#0a0a0f;--color-surface:#12121a;--color-text:#e0e0ff;--color-text-muted:#7a7996;--color-primary:#4f98e3;--color-border:#1a1a2e;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',sans-serif;}
#app{width:100vw;height:100vh;display:flex;flex-direction:column;background:#000;position:relative;}
#camera-container{position:relative;flex:1;overflow:hidden;background:#000;}
#video{width:100%;height:100%;object-fit:cover;display:block;}
#canvas-overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
#saber-wrapper{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);cursor:grab;touch-action:none;user-select:none;width:16px;}
#saber-wrapper:active{cursor:grabbing;}
#saber{width:16px;position:relative;transform-origin:bottom center;}
#blade{width:100%;height:180px;border-radius:8px 8px 2px 2px;background:linear-gradient(to top,#fff 0%,#00f0ff 30%,#00aff 70%,transparent 100%);box-shadow:0 0 8px #00ccff,0 0 20px 8px #0088ff88,0 0 40px 16px #0044ff44;animation:flicker 0.12s infinite alternate;}
#hilt{width:22px;height:64px;border-radius:4px;background:linear-gradient(135deg,#888,#333,#999,#444);border:3px solid #aaa;position:absolute;bottom:-44px;left:50%;transform:translateX(-50%);}
box-shadow:0 0 6px #0008;
}
@keyframes flicker{0%{opacity:1}100%{opacity:0.88}}
.color-btn{width:32px;height:32px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all 0.2s;}
.color-btn.active{border-color:#fff;}
.color-blue{background:#00aff;}
.color-red{background:#f00;}
.color-green{background:#0f0;}
.color-purple{background:#a0f;}
.color-yellow{background:#ff0;}
#hud{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;}
.hud-corner{position:absolute;width:40px;height:40px;}
.hud-corner::before,.hud-corner::after{content:'';position:absolute;background:#0ff;box-shadow:0 0 10px #0ff;}
.hud-corner::before{width:20px;height:2px;}
.hud-corner::after{width:2px;height:20px;}
.hud-top-left{top:20px;left:20px;}
.hud-top-left::before{top:0;left:0;}
.hud-top-left::after{top:0;left:0;}
.hud-top-right{top:20px;right:20px;}
.hud-top-right::before{top:0;right:0;}
.hud-top-right::after{top:0;right:0;}
.hud-bottom-left{bottom:20px;left:20px;}
.hud-bottom-left::before{bottom:0;left:0;}
.hud-bottom-left::after{bottom:0;left:0;}
.hud-bottom-right{bottom:20px;right:20px;}
.hud-bottom-right::before{bottom:0;right:0;}
.hud-bottom-right::after{bottom:0;right:0;}
#controls{position:absolute;bottom:40px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:20px;pointer-events:all;z-index:20;}
#color-selector{display:flex;gap:12px;}
.btn-group{display:flex;gap:12px;}
.btn{padding:12px 24px;background:linear-gradient(135deg,#333,#111);color:#fff;border:2px solid #0ff;border-radius:8px;font-size:16px;font-weight:bold;cursor:pointer;transition:all 0.2s;text-transform:uppercase;letter-spacing:1px;box-shadow:0 0 20px #0ff4;}
.btn:active{transform:scale(0.95);}
.btn-capture{background:linear-gradient(135deg,#0ff,#08f);border-color:#0ff;}
#start-screen{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#000,#001a2e);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;}
#start-screen h1{font-size:48px;color:#0ff;text-shadow:0 0 20px #0ff;margin-bottom:20px;text-transform:uppercase;letter-spacing:4px;}
#start-screen .subtitle{font-size:18px;color:#7af;margin-bottom:60px;}
#start-btn{padding:20px 60px;font-size:24px;}
</style>
</head>
<body>
<div id="app">
<div id="start-screen">
<h1>Lightsaber AR</h1>
<p class="subtitle">Activate your camera</p>
<button class="btn btn-capture" id="start-btn">START</button>
</div>
<div id="camera-container" style="display:none;">
<video id="video" playsinline autoplay></video>
<canvas id="canvas-overlay"></canvas>
<div id="hud">
<div class="hud-corner hud-top-left"></div>
<div class="hud-corner hud-top-right"></div>
<div class="hud-corner hud-bottom-left"></div>
<div class="hud-corner hud-bottom-right"></div>
</div>
<div id="saber-wrapper">
<div id="saber">
<div id="blade"></div>
<div id="hilt"></div>
</div>
</div>
</div>
<div id="controls" style="display:none;">
<div id="color-selector">
<div class="color-btn color-blue active" data-color="blue"></div>
<div class="color-btn color-red" data-color="red"></div>
<div class="color-btn color-green" data-color="green"></div>
<div class="color-btn color-purple" data-color="purple"></div>
<div class="color-btn color-yellow" data-color="yellow"></div>
</div>
<div class="btn-group">
<button class="btn btn-capture" id="capture-btn">CAPTURE</button>
</div>
</div>
</div>
<script>
const video=document.getElementById('video');
const canvas=document.getElementById('canvas-overlay');
const ctx=canvas.getContext('2d');
const saberWrapper=document.getElementById('saber-wrapper');
const blade=document.getElementById('blade');
const startScreen=document.getElementById('start-screen');
const cameraContainer=document.getElementById('camera-container');
const controls=document.getElementById('controls');
const startBtn=document.getElementById('start-btn');
const captureBtn=document.getElementById('capture-btn');
const colorBtns=document.querySelectorAll('.color-btn');
let currentColor='blue';
const colors={
blue:{gradient:'linear-gradient(to top,#fff 0%,#00f0ff 30%,#00aff 70%,transparent 100%)',glow:'#00ccff'},
red:{gradient:'linear-gradient(to top,#fff 0%,#ff4040 30%,#f00 70%,transparent 100%)',glow:'#ff0000'},
green:{gradient:'linear-gradient(to top,#fff 0%,#40ff40 30%,#0f0 70%,transparent 100%)',glow:'#00ff00'},
purple:{gradient:'linear-gradient(to top,#fff 0%,#d040ff 30%,#a0f 70%,transparent 100%)',glow:'#aa00ff'},
yellow:{gradient:'linear-gradient(to top,#fff 0%,#ffff40 30%,#ff0 70%,transparent 100%)',glow:'#ffff00'}
};
function setBladeColor(color){
currentColor=color;
const c=colors[color];
blade.style.background=c.gradient;
blade.style.boxShadow=`0 0 8px ${c.glow},0 0 20px 8px ${c.glow}88,0 0 40px 16px ${c.glow}44`;
}
colorBtns.forEach(btn=>{
btn.addEventListener('click',()=>{
colorBtns.forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
setBladeColor(btn.dataset.color);
});
});
let mouseX=window.innerWidth/2,mouseY=window.innerHeight/2;
function updateSaberPosition(x,y){
saberWrapper.style.left=x+'px';
saberWrapper.style.top=y+'px';
saberWrapper.style.transform='translate(-50%,-50%)';
}
document.addEventListener('mousemove',e=>{
mouseX=e.clientX;
mouseY=e.clientY;
updateSaberPosition(mouseX,mouseY);
});
document.addEventListener('touchmove',e=>{
if(e.touches.length>0){
const touch=e.touches[0];
mouseX=touch.clientX;
mouseY=touch.clientY;
updateSaberPosition(mouseX,mouseY);
}
},{passive:false});
startBtn.addEventListener('click',async()=>{
try{
const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
video.srcObject=stream;
startScreen.style.display='none';
cameraContainer.style.display='block';
controls.style.display='flex';
canvas.width=video.videoWidth;
canvas.height=video.videoHeight;
}catch(err){
alert('Camera access denied');
}
});
captureBtn.addEventListener('click',()=>{
const captureCanvas=document.createElement('canvas');
captureCanvas.width=video.videoWidth;
captureCanvas.height=video.videoHeight;
const captureCtx=captureCanvas.getContext('2d');
captureCtx.drawImage(video,0,0);
const rect=saberWrapper.getBoundingClientRect();
const videoRect=video.getBoundingClientRect();
const scaleX=video.videoWidth/videoRect.width;
const scaleY=video.videoHeight/videoRect.height;
const saberX=(rect.left+rect.width/2-videoRect.left)*scaleX;
const saberY=(rect.top+rect.height/2-videoRect.top)*scaleY;
const bladeHeight=180*Math.min(scaleX,scaleY);
const bladeWidth=16*Math.min(scaleX,scaleY);
const c=colors[currentColor];
const gradient=captureCtx.createLinearGradient(saberX,saberY,saberX,saberY-bladeHeight);
gradient.addColorStop(0,'#ffffff');
if(currentColor==='blue'){gradient.addColorStop(0.3,'#00f0ff');gradient.addColorStop(0.7,'#00aaff');}
else if(currentColor==='red'){gradient.addColorStop(0.3,'#ff4040');gradient.addColorStop(0.7,'#ff0000');}
else if(currentColor==='green'){gradient.addColorStop(0.3,'#40ff40');gradient.addColorStop(0.7,'#00ff00');}
else if(currentColor==='purple'){gradient.addColorStop(0.3,'#d040ff');gradient.addColorStop(0.7,'#aa00ff');}
else if(currentColor==='yellow'){gradient.addColorStop(0.3,'#ffff40');gradient.addColorStop(0.7,'#ffff00');}
gradient.addColorStop(1,'rgba(0,0,0,0)');
captureCtx.shadowBlur=40;
captureCtx.shadowColor=c.glow;
captureCtx.fillStyle=gradient;
captureCtx.fillRect(saberX-bladeWidth/2,saberY-bladeHeight,bladeWidth,bladeHeight);
const hiltHeight=64*Math.min(scaleX,scaleY);
const hiltWidth=22*Math.min(scaleX,scaleY);
captureCtx.shadowBlur=0;
const hiltGrad=captureCtx.createLinearGradient(saberX,saberY,saberX,saberY+hiltHeight);
hiltGrad.addColorStop(0,'#888888');
hiltGrad.addColorStop(0.25,'#333333');
hiltGrad.addColorStop(0.5,'#999999');
hiltGrad.addColorStop(0.75,'#444444');
hiltGrad.addColorStop(1,'#666666');
captureCtx.fillStyle=hiltGrad;
captureCtx.fillRect(saberX-hiltWidth/2,saberY,hiltWidth,hiltHeight);
captureCanvas.toBlob(blob=>{
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='lightsaber_'+Date.now()+'.jpg';
a.click();
URL.revokeObjectURL(url);
});
});
</script>
</body>
</html>
