<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000010">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Caméra AR avec sabre laser — effets réalistes">
<title>Lightsaber AR Camera</title>
<style>
:root { --cyan: #00e5ff; }

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%; height: 100%;
  overflow: hidden; background: #000;
  font-family: 'Segoe UI', system-ui, sans-serif;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
}

/* ─── START ─────────────────────────────────────────────────── */
#start {
  position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 55%, #001830 0%, #000410 55%, #000 100%);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 100; gap: 0;
}

.demo-wrap { position: relative; width: 20px; height: 248px; margin-bottom: 32px; }
.demo-blade {
  width: 10px; height: 185px;
  border-radius: 5px 5px 2px 2px;
  background: linear-gradient(to top, #fff 0%, #00e5ff 30%, #007fff 70%, transparent);
  box-shadow: 0 0 10px #00e5ff, 0 0 30px 10px #0055ff88, 0 0 60px 20px #0033ff33;
  animation: flick .14s infinite alternate,
             extend .8s cubic-bezier(.15,0,0,1) forwards;
  transform-origin: bottom center;
  margin: 0 auto;
}
.demo-hilt {
  width: 18px; height: 52px;
  border-radius: 3px;
  background: linear-gradient(135deg, #aaa, #444, #888, #333);
  border: 2px solid #888;
  margin: 4px auto 0;
}
@keyframes flick   { to { opacity:.9; filter:brightness(1.07); } }
@keyframes extend  { from { transform:scaleY(0); } to { transform:scaleY(1); } }

.start-title {
  font-size: clamp(28px, 8vw, 52px); font-weight: 900;
  letter-spacing: 6px; text-transform: uppercase; color: #fff;
  text-shadow: 0 0 20px #00e5ff, 0 0 60px #0055ff;
  margin-bottom: 6px;
}
.start-sub {
  font-size: 12px; color: #3a5870;
  letter-spacing: 4px; text-transform: uppercase; margin-bottom: 44px;
}
#start-btn {
  padding: 15px 50px; font-size: 16px; font-weight: 700;
  letter-spacing: 4px; text-transform: uppercase;
  color: #000; background: #00e5ff;
  border: none; border-radius: 4px; cursor: pointer;
  box-shadow: 0 0 24px #00e5ff, 0 0 60px #0066ff88;
  transition: transform .15s; -webkit-user-select: none; user-select: none;
}
#start-btn:active { transform: scale(.95); }

/* ─── APP ──────────────────────────────────────────────────── */
#app { width: 100vw; height: 100vh; position: relative; background: #000; }

#camera-container { position: absolute; inset: 0; overflow: hidden; }
#video { width: 100%; height: 100%; object-fit: cover; display: block; }

/* Saber canvas overlay */
#sc {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 5;
}

/* Scanlines via pseudo-element */
#camera-container::after {
  content: ''; position: absolute; inset: 0;
  background: repeating-linear-gradient(
    to bottom, transparent 0px, transparent 3px,
    rgba(0,0,0,.07) 3px, rgba(0,0,0,.07) 4px
  );
  pointer-events: none; z-index: 8;
}

/* Vignette */
#camera-container::before {
  content: ''; position: absolute; inset: 0;
  background: radial-gradient(ellipse at 50% 50%, transparent 42%, rgba(0,0,0,.7) 100%);
  pointer-events: none; z-index: 6;
}

/* ─── HUD ──────────────────────────────────────────────────── */
#hud {
  position: absolute; inset: 0;
  pointer-events: none; z-index: 10;
}
.hc { position: absolute; width: 44px; height: 44px; }
.hc::before, .hc::after {
  content: ''; position: absolute;
  background: var(--cyan); box-shadow: 0 0 6px var(--cyan);
}
.hc::before { width: 22px; height: 2px; }
.hc::after  { width: 2px;  height: 22px; }
.tl { top:16px; left:16px; }   .tl::before,.tl::after { top:0; left:0; }
.tr { top:16px; right:16px; }  .tr::before { top:0; right:0; } .tr::after { top:0; right:0; }
.bl { bottom:16px; left:16px; }.bl::before { bottom:0; left:0; }.bl::after { bottom:0; left:0; }
.br { bottom:16px; right:16px; }.br::before,.br::after { bottom:0; right:0; }
#hud::after {
  content: ''; position: absolute;
  top:50%; left:50%;
  width:44px; height:44px;
  margin:-22px 0 0 -22px;
  border:1px solid rgba(0,229,255,.22);
  border-radius:50%;
}

/* ─── FLASH ────────────────────────────────────────────────── */
#flash {
  position: fixed; inset: 0; background: #fff;
  opacity: 0; pointer-events: none; z-index: 999;
}
@keyframes flash-fade { 0% { opacity:.85; } 100% { opacity:0; } }
#flash.go { animation: flash-fade .45s ease-out forwards; }

/* ─── CONTROLS ─────────────────────────────────────────────── */
#controls {
  position: absolute; bottom: 0; left: 0; right: 0;
  padding: 14px 16px max(28px, env(safe-area-inset-bottom));
  display: flex; flex-direction: column; align-items: center; gap: 12px;
  z-index: 20;
  background: linear-gradient(to top, rgba(0,0,0,.82) 0%, transparent 100%);
  pointer-events: none;
}
#controls > * { pointer-events: all; }

#color-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }

.cb {
  width: 26px; height: 26px; border-radius: 50%;
  cursor: pointer; border: 2.5px solid transparent;
  transition: transform .18s, border-color .18s, box-shadow .18s;
  -webkit-user-select: none; user-select: none;
}
.cb.on { border-color: #fff; transform: scale(1.28); }

.cb[data-c=blue]   { background: #00aaff; box-shadow: 0 0 8px #00aaff; }
.cb[data-c=red]    { background: #ff2020; box-shadow: 0 0 8px #ff2020; }
.cb[data-c=green]  { background: #00ee44; box-shadow: 0 0 8px #00ee44; }
.cb[data-c=purple] { background: #aa00ff; box-shadow: 0 0 8px #aa00ff; }
.cb[data-c=yellow] { background: #ffee00; box-shadow: 0 0 8px #ffee00; }
.cb[data-c=orange] { background: #ff7700; box-shadow: 0 0 8px #ff7700; }
.cb[data-c=white]  { background: #ddeeff; box-shadow: 0 0 8px #ddeeff; }
.cb.on[data-c=blue]   { box-shadow: 0 0 14px 3px #00aaff; }
.cb.on[data-c=red]    { box-shadow: 0 0 14px 3px #ff2020; }
.cb.on[data-c=green]  { box-shadow: 0 0 14px 3px #00ee44; }
.cb.on[data-c=purple] { box-shadow: 0 0 14px 3px #aa00ff; }
.cb.on[data-c=yellow] { box-shadow: 0 0 14px 3px #ffee00; }
.cb.on[data-c=orange] { box-shadow: 0 0 14px 3px #ff7700; }
.cb.on[data-c=white]  { box-shadow: 0 0 14px 3px #ddeeff; }

#slider-row {
  display: flex; align-items: center; gap: 10px;
  color: #3a5870; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase;
}
input[type=range] {
  -webkit-appearance: none; appearance: none;
  width: 120px; height: 3px; border-radius: 2px;
  background: #152535; outline: none; cursor: pointer;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 18px; height: 18px; border-radius: 50%;
  background: var(--cyan); box-shadow: 0 0 8px var(--cyan); cursor: pointer;
}

#action-row { display: flex; gap: 12px; align-items: center; }

.btn {
  padding: 11px 18px;
  background: rgba(0,10,24,.88);
  color: var(--cyan); border: 1.5px solid var(--cyan);
  border-radius: 6px; font-size: 12px; font-weight: 700;
  cursor: pointer; transition: transform .15s, filter .15s;
  text-transform: uppercase; letter-spacing: 2px;
  box-shadow: 0 0 10px rgba(0,229,255,.28);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  -webkit-user-select: none; user-select: none;
}
.btn:active { transform: scale(.91); filter: brightness(1.5); }

.btn-capture {
  width: 72px; height: 72px; border-radius: 50%;
  padding: 0; font-size: 10px; font-weight: 900; letter-spacing: 1.5px;
  border-width: 3px;
  box-shadow: 0 0 24px rgba(0,229,255,.55), inset 0 0 14px rgba(0,229,255,.18);
  position: relative; overflow: hidden;
}
.btn-capture::before {
  content: ''; position: absolute; inset: 7px; border-radius: 50%;
  background: radial-gradient(circle, rgba(0,229,255,.4), transparent);
}

.btn-icon {
  width: 48px; height: 48px; border-radius: 50%;
  padding: 0; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
}
.btn-muted { opacity: .38; }

/* ─── PREVIEW ──────────────────────────────────────────────── */
#preview {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.92);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  z-index: 200; gap: 16px;
  opacity: 0; pointer-events: none; transition: opacity .2s;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#preview.on { opacity: 1; pointer-events: all; }
#preview-img {
  max-width: 90vw; max-height: 66vh;
  border-radius: 8px;
  border: 1px solid rgba(0,229,255,.38);
  box-shadow: 0 0 40px rgba(0,80,255,.28);
}
#preview-btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
</style>
</head>
<body>

<div id="flash"></div>

<!-- ─ START ─────────────────────────────────────────────────── -->
<div id="start">
  <div class="demo-wrap">
    <div class="demo-blade"></div>
    <div class="demo-hilt"></div>
  </div>
  <h1 class="start-title">Lightsaber</h1>
  <p class="start-sub">AR Camera</p>
  <button id="start-btn">ACTIVER</button>
</div>

<!-- ─ APP ──────────────────────────────────────────────────── -->
<div id="app" style="display:none">
  <div id="camera-container">
    <video id="video" playsinline autoplay muted webkit-playsinline></video>
    <canvas id="sc"></canvas>
    <div id="hud">
      <div class="hc tl"></div><div class="hc tr"></div>
      <div class="hc bl"></div><div class="hc br"></div>
    </div>
  </div>
  <div id="controls">
    <div id="color-row">
      <div class="cb on" data-c="blue"></div>
      <div class="cb"    data-c="red"></div>
      <div class="cb"    data-c="green"></div>
      <div class="cb"    data-c="purple"></div>
      <div class="cb"    data-c="yellow"></div>
      <div class="cb"    data-c="orange"></div>
      <div class="cb"    data-c="white"></div>
    </div>
    <div id="slider-row">
      <span>Lame</span>
      <input type="range" id="slider" min="80" max="340" value="280">
    </div>
    <div id="action-row">
      <button class="btn btn-icon" id="flip-btn">⟳</button>
      <button class="btn btn-capture" id="cap-btn">PIC</button>
      <button class="btn btn-icon" id="snd-btn">🔊</button>
    </div>
  </div>
</div>

<!-- ─ PREVIEW ──────────────────────────────────────────────── -->
<div id="preview">
  <img id="preview-img" alt="">
  <div id="preview-btns">
    <button class="btn" id="dl-btn">💾 GARDER</button>
    <button class="btn" id="close-btn">✕ FERMER</button>
  </div>
</div>

<script>
/* ══════════════════════════════════════════════════════════
   COLORS
══════════════════════════════════════════════════════════ */
const C = {
  blue:   { glow:'#00aaff', mid1:'#00e5ff', mid2:'#007fff', core:'#aaddff' },
  red:    { glow:'#ff2020', mid1:'#ff6060', mid2:'#ff0000', core:'#ffbbbb' },
  green:  { glow:'#00ee44', mid1:'#60ff70', mid2:'#00dd00', core:'#aaffbb' },
  purple: { glow:'#cc00ff', mid1:'#dd60ff', mid2:'#aa00ff', core:'#eeccff' },
  yellow: { glow:'#ffee00', mid1:'#ffff60', mid2:'#ffdd00', core:'#ffffaa' },
  orange: { glow:'#ff8800', mid1:'#ffbb44', mid2:'#ff6600', core:'#ffd090' },
  white:  { glow:'#cce0ff', mid1:'#eef4ff', mid2:'#c0d4ff', core:'#ffffff' },
};

/* ══════════════════════════════════════════════════════════
   STATE
══════════════════════════════════════════════════════════ */
let col    = 'blue';
let facing = 'environment';
let strm   = null;
let sndOn  = true;
let blade  = 280;
let capBlob= null;
let camOn  = false;

// Saber physics
let cx = innerWidth/2, cy = innerHeight * 0.65;
let px = cx, py = cy;
let vx = 0, vy = 0;
let ang = 0;

// Motion trail
const TRAIL = 10;
const trail = [];

// Crackle timing
let nextCrackle = 0;

// Audio
let actx = null, humGain = null;
let lastSwing = 0;

/* ══════════════════════════════════════════════════════════
   CANVAS SETUP
══════════════════════════════════════════════════════════ */
const sc   = document.getElementById('sc');
const sctx = sc.getContext('2d');
let SW, SH;

function resizeSC() {
  SW = sc.style.width  = sc.width  = innerWidth;
  SH = sc.style.height = sc.height = innerHeight;
}
resizeSC();
addEventListener('resize', resizeSC);
addEventListener('orientationchange', () => setTimeout(() => {
  resizeSC();
  cx = innerWidth/2; cy = innerHeight/2;
  px = cx; py = cy; vx = vy = 0; trail.length = 0;
}, 200));

/* ══════════════════════════════════════════════════════════
   CANVAS HELPERS
══════════════════════════════════════════════════════════ */
function h2r(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a.toFixed(3)})`;
}

function rRect(ctx, x, y, w, h, r) {
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

/* ══════════════════════════════════════════════════════════
   DRAW BLADE (canvas-based, multi-layer)
══════════════════════════════════════════════════════════ */
function drawBlade(ctx, bh, c, t, alpha) {
  const fl = (0.90 + Math.sin(t*43.7)*0.06 + Math.sin(t*19.1)*0.04) * alpha;

  // ── GLOW : blending additif (lighter) — les couches s'accumulent ──
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';

  // 5 passes de glow de plus en plus concentrées
  for (const [hw, a] of [[60,0.06],[44,0.12],[30,0.20],[18,0.32],[10,0.48]]) {
    const g = ctx.createLinearGradient(0, 0, 0, -bh);
    g.addColorStop(0,    h2r(c.glow, a * fl));
    g.addColorStop(0.76, h2r(c.glow, a * 0.30 * fl));
    g.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    rRect(ctx, -hw, -bh, hw*2, bh, hw);
    ctx.fill();
  }

  // Orbe au bout (additif)
  const ty  = -bh;
  const tr2 = 10 + Math.sin(t * 26.3) * 2.5;
  const og  = ctx.createRadialGradient(0, ty, 0, 0, ty, tr2 * 5);
  og.addColorStop(0,    `rgba(255,255,255,${0.95*fl})`);
  og.addColorStop(0.20, h2r(c.mid1, 0.88 * fl));
  og.addColorStop(0.55, h2r(c.glow,  0.55 * fl));
  og.addColorStop(1,    'rgba(0,0,0,0)');
  ctx.fillStyle = og;
  ctx.fillRect(-tr2*5, ty-tr2*5, tr2*10, tr2*10);

  ctx.restore(); // fin du blending additif

  // ── Corps de lame (ombrage cylindrique horizontal) ──
  const bw = 10;
  const hg = ctx.createLinearGradient(-bw, 0, bw, 0);
  hg.addColorStop(0,    h2r(c.mid2, 0.70));
  hg.addColorStop(0.22, h2r(c.mid1, 0.96));
  hg.addColorStop(0.50, 'rgba(255,255,255,0.99)');
  hg.addColorStop(0.78, h2r(c.mid1, 0.96));
  hg.addColorStop(1,    h2r(c.mid2, 0.70));
  ctx.save();
  ctx.globalAlpha = fl;
  ctx.fillStyle = hg;
  rRect(ctx, -bw, -bh, bw*2, bh, bw);
  ctx.fill();
  ctx.restore();

  // ── Core blanc-chaud ──
  const cw = 3;
  const vg = ctx.createLinearGradient(0, 0, 0, -bh);
  vg.addColorStop(0,    `rgba(255,255,255,${0.99*fl})`);
  vg.addColorStop(0.84, `rgba(255,255,255,${0.62*fl})`);
  vg.addColorStop(1,    'rgba(255,255,255,0)');
  ctx.fillStyle = vg;
  rRect(ctx, -cw, -bh, cw*2, bh, cw);
  ctx.fill();
}

/* ══════════════════════════════════════════════════════════
   DRAW BLADE (fast trail version)
══════════════════════════════════════════════════════════ */
function drawBladeFast(ctx, bh, c, a) {
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const [hw, fa] of [[32, a*0.5],[18, a*0.8],[10, a]]) {
    const g = ctx.createLinearGradient(0, 0, 0, -bh);
    g.addColorStop(0,   h2r(c.glow, fa));
    g.addColorStop(0.8, h2r(c.glow, fa * 0.25));
    g.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    rRect(ctx, -hw, -bh, hw*2, bh, hw);
    ctx.fill();
  }
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════
   DRAW HILT (canvas — metallic cylinder)
══════════════════════════════════════════════════════════ */
function drawHilt(ctx, c, t) {
  const hw = 11, hh = 56;

  // Guard (emitter cap at blade junction)
  const gw = 15, gh = 7;
  const gg = ctx.createLinearGradient(-gw, 0, gw, 0);
  gg.addColorStop(0,   '#2a2a2a');
  gg.addColorStop(0.4, '#888');
  gg.addColorStop(0.6, '#aaa');
  gg.addColorStop(1,   '#2a2a2a');
  ctx.fillStyle = gg;
  rRect(ctx, -gw, -3, gw*2, gh+3, 2);
  ctx.fill();

  // Main body (metallic cylinder shading left-to-right)
  const mg = ctx.createLinearGradient(-hw, 0, hw, 0);
  mg.addColorStop(0,    '#333');
  mg.addColorStop(0.18, '#888');
  mg.addColorStop(0.42, '#ddd');
  mg.addColorStop(0.56, '#bbb');
  mg.addColorStop(0.80, '#777');
  mg.addColorStop(1,    '#2a2a2a');
  ctx.fillStyle = mg;
  rRect(ctx, -hw, gh, hw*2, hh, 3);
  ctx.fill();

  // Grip rings
  for (const ry of [gh+9, gh+20, gh+31]) {
    const rg = ctx.createLinearGradient(-hw, 0, hw, 0);
    rg.addColorStop(0,   '#444');
    rg.addColorStop(0.5, '#fff');
    rg.addColorStop(1,   '#444');
    ctx.fillStyle = rg;
    ctx.fillRect(-hw-1, ry, hw*2+2, 3);
  }

  // Pommel (end cap)
  const pg = ctx.createLinearGradient(-hw, 0, hw, 0);
  pg.addColorStop(0,   '#1a1a1a');
  pg.addColorStop(0.5, '#555');
  pg.addColorStop(1,   '#1a1a1a');
  ctx.fillStyle = pg;
  rRect(ctx, -hw+1, gh+hh-7, (hw-1)*2, 9, 3);
  ctx.fill();

  // Kyber crystal accent (pulsing color dot)
  const crystG = ctx.createRadialGradient(0, gh+42, 0, 0, gh+42, 5);
  const pulse  = 0.6 + Math.sin(t * 2.8) * 0.25;
  crystG.addColorStop(0,   h2r(c.mid1, pulse));
  crystG.addColorStop(0.5, h2r(c.glow,  pulse * 0.5));
  crystG.addColorStop(1,   'rgba(0,0,0,0)');
  ctx.fillStyle = crystG;
  ctx.beginPath(); ctx.arc(0, gh+42, 5, 0, Math.PI*2); ctx.fill();
}

/* ══════════════════════════════════════════════════════════
   ELECTRIC CRACKLE
══════════════════════════════════════════════════════════ */
function drawCrackle(ctx, bh, c) {
  ctx.save();
  ctx.strokeStyle = h2r(c.glow, 0.75);
  ctx.lineWidth   = 0.7;
  ctx.shadowBlur  = 5;
  ctx.shadowColor = c.glow;
  const arcs = 1 + Math.floor(Math.random() * 2);
  for (let i = 0; i < arcs; i++) {
    const sy   = -(bh * 0.15 + Math.random() * bh * 0.7);
    const side = (Math.random() < .5 ? 1 : -1) * (4 + Math.random() * 3);
    ctx.beginPath();
    ctx.moveTo(side * 0.4, sy);
    const pts = 3 + Math.floor(Math.random() * 3);
    for (let j = 0; j < pts; j++) {
      const nx = side + (Math.random() - .5) * 10;
      const ny = sy   + (Math.random() - .5) * bh * 0.06;
      ctx.lineTo(nx, ny);
    }
    ctx.stroke();
  }
  ctx.restore();
}

/* ══════════════════════════════════════════════════════════
   RENDER LOOP
══════════════════════════════════════════════════════════ */
function render(ts) {
  requestAnimationFrame(render);
  const t   = ts / 1000;
  const spd = Math.sqrt(vx*vx + vy*vy);
  const c   = C[col];

  sctx.clearRect(0, 0, SW, SH);
  if (!camOn) return;

  // Motion trail
  if (spd > 7 && trail.length > 1) {
    const intensity = Math.min((spd - 7) / 35, 1);
    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const a = (i / trail.length) * 0.22 * intensity;
      sctx.save();
      sctx.globalAlpha = a;
      sctx.translate(p.x, p.y);
      sctx.rotate(p.a);
      drawBladeFast(sctx, blade * 0.85, c, 1);
      sctx.restore();
    }
  }

  // Main saber
  sctx.save();
  sctx.translate(cx, cy);
  sctx.rotate(ang);
  drawBlade(sctx, blade, c, t, 1);
  drawHilt(sctx, c, t);
  sctx.restore();

  // Electric crackle
  const now = performance.now();
  if (now > nextCrackle) {
    sctx.save();
    sctx.translate(cx, cy);
    sctx.rotate(ang);
    drawCrackle(sctx, blade, c);
    sctx.restore();
    nextCrackle = now + 80 + Math.random() * 150;
  }
}
requestAnimationFrame(render);

/* ══════════════════════════════════════════════════════════
   POINTER MOVEMENT
══════════════════════════════════════════════════════════ */
function moveSaber(x, y) {
  cx = x; cy = y;
  const dx = x - px, dy = y - py;
  vx = vx * .65 + dx * .35;
  vy = vy * .65 + dy * .35;
  const spd = Math.sqrt(vx*vx + vy*vy);

  if (spd > 1.0) {
    const target = Math.atan2(vx, -vy);
    let diff = target - ang;
    if (diff >  Math.PI) diff -= 2*Math.PI;
    if (diff < -Math.PI) diff += 2*Math.PI;
    ang += diff * Math.min(0.11 + spd * 0.004, 0.40);
    const now = Date.now();
    if (spd > 11 && now - lastSwing > 160 && sndOn) {
      playSwing(Math.min(spd / 50, 1));
      lastSwing = now;
    }
  } else {
    ang *= 0.91;
  }

  trail.push({ x: cx, y: cy, a: ang });
  if (trail.length > TRAIL) trail.shift();

  px = x; py = y;
}

document.addEventListener('mousemove', e => moveSaber(e.clientX, e.clientY));

document.addEventListener('touchmove', e => {
  e.preventDefault();
  moveSaber(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: false });

document.addEventListener('touchstart', e => {
  px = e.touches[0].clientX;
  py = e.touches[0].clientY;
  moveSaber(px, py);
}, { passive: true });

/* ══════════════════════════════════════════════════════════
   AUDIO
══════════════════════════════════════════════════════════ */
function initAudio() {
  if (actx) return;
  actx = new (window.AudioContext || window.webkitAudioContext)();
  humGain = actx.createGain();
  humGain.gain.value = 0;
  humGain.connect(actx.destination);
  [120, 240, 480].forEach((f, i) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.value = [.20, .09, .04][i];
    o.connect(g); g.connect(humGain); o.start();
  });
  const t = actx.currentTime;
  const sw = actx.createOscillator(), sg = actx.createGain();
  sw.type = 'sawtooth';
  sw.frequency.setValueAtTime(160, t);
  sw.frequency.exponentialRampToValueAtTime(900, t + .65);
  sg.gain.setValueAtTime(.18, t);
  sg.gain.exponentialRampToValueAtTime(.001, t + .65);
  sw.connect(sg); sg.connect(actx.destination);
  sw.start(); sw.stop(t + .65);
  humGain.gain.setValueAtTime(0, t + .35);
  humGain.gain.linearRampToValueAtTime(.11, t + 1.0);
}

function playSwing(intensity) {
  if (!actx || !sndOn) return;
  const t = actx.currentTime;
  const len = Math.floor(actx.sampleRate * .2);
  const buf = actx.createBuffer(1, len, actx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = actx.createBufferSource();
  const bpf = actx.createBiquadFilter();
  const g   = actx.createGain();
  src.buffer = buf; bpf.type = 'bandpass';
  bpf.frequency.value = 400 + intensity * 800; bpf.Q.value = 1.2;
  g.gain.setValueAtTime(Math.min(intensity * .28, .28), t);
  g.gain.exponentialRampToValueAtTime(.001, t + .2);
  src.connect(bpf); bpf.connect(g); g.connect(actx.destination);
  src.start();
}

function playSnap() {
  if (!actx || !sndOn) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'square';
  o.frequency.setValueAtTime(2000, t);
  o.frequency.exponentialRampToValueAtTime(300, t + .12);
  g.gain.setValueAtTime(.07, t);
  g.gain.exponentialRampToValueAtTime(.001, t + .12);
  o.connect(g); g.connect(actx.destination);
  o.start(); o.stop(t + .12);
}

/* ══════════════════════════════════════════════════════════
   COLOR
══════════════════════════════════════════════════════════ */
document.querySelectorAll('.cb').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.cb').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    col = b.dataset.c;
  });
});

/* ══════════════════════════════════════════════════════════
   BLADE LENGTH
══════════════════════════════════════════════════════════ */
document.getElementById('slider').addEventListener('input', function() {
  blade = +this.value;
});

/* ══════════════════════════════════════════════════════════
   CAMERA
══════════════════════════════════════════════════════════ */
const video = document.getElementById('video');

async function startCam(mode) {
  if (strm) strm.getTracks().forEach(t => t.stop());
  try {
    strm = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: mode, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false,
    });
    video.srcObject = strm;
    video.style.transform = mode === 'user' ? 'scaleX(-1)' : '';
    facing = mode;
  } catch (e) { alert('Caméra refusée : ' + e.message); }
}

document.getElementById('start-btn').addEventListener('click', async () => {
  initAudio();
  await startCam(facing);
  document.getElementById('start').style.display = 'none';
  document.getElementById('app').style.display   = 'block';
  camOn = true;
});

document.getElementById('flip-btn').addEventListener('click', () =>
  startCam(facing === 'environment' ? 'user' : 'environment')
);

/* ══════════════════════════════════════════════════════════
   SOUND TOGGLE
══════════════════════════════════════════════════════════ */
const sndBtn = document.getElementById('snd-btn');
sndBtn.addEventListener('click', () => {
  sndOn = !sndOn;
  sndBtn.textContent = sndOn ? '🔊' : '🔇';
  sndBtn.classList.toggle('btn-muted', !sndOn);
  if (humGain) humGain.gain.linearRampToValueAtTime(sndOn ? .11 : 0, actx.currentTime + .3);
});

/* ══════════════════════════════════════════════════════════
   KEYBOARD SHORTCUTS
══════════════════════════════════════════════════════════ */
const KM = {'1':'blue','2':'red','3':'green','4':'purple','5':'yellow','6':'orange','7':'white'};
document.addEventListener('keydown', e => {
  if (e.key === ' ') { e.preventDefault(); document.getElementById('cap-btn').click(); }
  if (e.key.toLowerCase() === 'f') document.getElementById('flip-btn').click();
  if (e.key.toLowerCase() === 'm') sndBtn.click();
  const k = KM[e.key];
  if (k) document.querySelector(`.cb[data-c="${k}"]`).click();
});

/* ══════════════════════════════════════════════════════════
   CAPTURE — reuses same drawing functions, scaled to video
══════════════════════════════════════════════════════════ */
document.getElementById('cap-btn').addEventListener('click', () => {
  if (!video.videoWidth) return;
  playSnap();
  const fl = document.getElementById('flash');
  fl.classList.remove('go'); void fl.offsetWidth; fl.classList.add('go');

  const vw = video.videoWidth, vh = video.videoHeight;
  const cvs = document.createElement('canvas');
  cvs.width = vw; cvs.height = vh;
  const ctx = cvs.getContext('2d');
  ctx.drawImage(video, 0, 0);

  const vr    = video.getBoundingClientRect();
  const scale = Math.min(vw / vr.width, vh / vr.height);
  let   px2   = (cx - vr.left) * (vw / vr.width);
  let   py2   = (cy - vr.top)  * (vh / vr.height);
  let   ang2  = ang;

  if (facing === 'user') { px2 = vw - px2; ang2 = -ang2; }
  px2 = Math.max(0, Math.min(vw, px2));
  py2 = Math.max(0, Math.min(vh, py2));

  const bh2 = blade   * scale;
  const t2  = performance.now() / 1000;

  ctx.save();
  ctx.translate(px2, py2);
  ctx.rotate(ang2);
  drawBlade(ctx, bh2, C[col], t2, 1);
  // Hilt scaled
  ctx.scale(scale, scale);
  drawHilt(ctx, C[col], t2);
  ctx.restore();

  cvs.toBlob(b => {
    capBlob = b;
    const url = URL.createObjectURL(b);
    document.getElementById('preview-img').src = url;
    document.getElementById('preview').classList.add('on');
  }, 'image/jpeg', .94);
});

/* ══════════════════════════════════════════════════════════
   PREVIEW
══════════════════════════════════════════════════════════ */
document.getElementById('dl-btn').addEventListener('click', () => {
  if (!capBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(capBlob);
  a.download = 'lightsaber_' + Date.now() + '.jpg';
  a.click();
});

document.getElementById('close-btn').addEventListener('click', () => {
  document.getElementById('preview').classList.remove('on');
  const img = document.getElementById('preview-img');
  if (img.src.startsWith('blob:')) URL.revokeObjectURL(img.src);
  img.src = ''; capBlob = null;
});

if (navigator.share) {
  const sb = document.createElement('button');
  sb.className = 'btn'; sb.textContent = '↑ PARTAGER';
  sb.addEventListener('click', async () => {
    if (!capBlob) return;
    try {
      await navigator.share({ files: [new File([capBlob],'lightsaber.jpg',{type:'image/jpeg'})], title:'Lightsaber AR' });
    } catch {}
  });
  document.getElementById('preview-btns').prepend(sb);
}
</script>
